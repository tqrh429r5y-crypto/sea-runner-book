name: Keep Supabase Alive

# Tiene attivo il database Supabase facendo una lettura ogni 2 giorni.
# Cron frequente per avere margine se GitHub Actions ritarda o salta esecuzioni.

on:
  schedule:
    - cron: '0 6 */2 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping del database Supabase
        run: |
          RESPONSE=$(curl -s -o /tmp/response.txt -w "%{http_code}" \
            "https://pmumkqnozzplstyayoyg.supabase.co/rest/v1/tours?select=id&limit=1" \
            -H "apikey: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiO
